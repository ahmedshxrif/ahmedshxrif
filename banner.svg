<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Ahmed Farahat</title>
  <desc id="d">Computer engineer. I build AI products and automate the work around them.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="22"/></clipPath>
    <radialGradient id="blue"><stop offset="0" stop-color="#8fa6ff" stop-opacity=".55"/><stop offset="1" stop-color="#8fa6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="lav"><stop offset="0" stop-color="#b7a3ff" stop-opacity=".45"/><stop offset="1" stop-color="#b7a3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint"><stop offset="0" stop-color="#7fe0c3" stop-opacity=".3"/><stop offset="1" stop-color="#7fe0c3" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.6" fill="#8fa6ff" opacity=".35"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="wave"><rect x="-600" width="600" height="320" fill="url(#fade)"><animate attributeName="x" from="-600" to="1200" dur="7s" repeatCount="indefinite"/></rect></mask>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0e1016"/>
    <circle r="330" fill="url(#blue)"><animate attributeName="cx" values="980;640;980" dur="26s" repeatCount="indefinite"/><animate attributeName="cy" values="-20;170;-20" dur="26s" repeatCount="indefinite"/></circle>
    <circle r="300" fill="url(#lav)"><animate attributeName="cx" values="90;470;90" dur="32s" repeatCount="indefinite"/><animate attributeName="cy" values="290;90;290" dur="32s" repeatCount="indefinite"/></circle>
    <circle r="260" fill="url(#mint)"><animate attributeName="cx" values="700;1050;700" dur="29s" repeatCount="indefinite"/><animate attributeName="cy" values="360;230;360" dur="29s" repeatCount="indefinite"/></circle>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#wave)" opacity=".9"/>
    <rect x=".5" y=".5" width="1199" height="319" rx="22" fill="none" stroke="#fff" stroke-opacity=".1"/>
    <rect width="1200" height="46" fill="#fff" fill-opacity=".03"/>
    <path d="M0 46.5H1200" stroke="#fff" stroke-opacity=".09"/>
    <g fill="none" stroke-width="1.6"><circle cx="30" cy="23" r="5.5" stroke="#8fa6ff"/><circle cx="50" cy="23" r="5.5" stroke="#b7a3ff"/><circle cx="70" cy="23" r="5.5" stroke="#7fe0c3"/></g>
    <text x="92" y="28" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e9ebf2">Hello</text>
    <text x="1172" y="28" text-anchor="end" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8d94a8">Dubai, UAE</text>
    <text x="600" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#e9ebf2">Ahmed Farahat</text>
    <text x="600" y="226" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#c2c8d8">Computer engineer. I build AI products and automate the work around them.</text>
  </g>
</svg>
